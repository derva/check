<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50 text-gray-900">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-6 py-4 bg-white shadow">
    <div class="text-2xl font-bold tracking-wide">CHECK APP</div>
    <ul class="flex space-x-6 text-lg">
      <li><a href="/" class="hover:text-blue-600 transition">Home</a></li>
      <li><a href="/upload" class="hover:text-blue-600 transition">Upload</a></li>
      <li><a href="/about" class="hover:text-blue-600 transition">About</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <main class="flex-grow flex flex-col items-center justify-start mt-16 px-4">
    <div class="text-center mb-10">
      <h1 class="text-3xl mb-6 font-semibold">Search for receipts or items</h1>
      <div class="max-w-md mx-auto">
        <input id="searchInput" type="text" placeholder="Type your query..."
          class="w-full px-5 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg">
      </div>
    </div>

    <!-- Items List -->
    <section id="itemsList" class="w-full max-w-3xl space-y-3">
      <!-- Example static items -->
      <div class="bg-white shadow-sm rounded-xl p-4 hover:shadow-md transition">
        <h2 class="font-semibold text-lg">Item 1 — Chicken File</h2>
        <p class="text-gray-600 text-sm">Price: 12.50 KM</p>
      </div>
      <div class="bg-white shadow-sm rounded-xl p-4 hover:shadow-md transition">
        <h2 class="font-semibold text-lg">Item 2 — Milk 1L</h2>
        <p class="text-gray-600 text-sm">Price: 2.10 KM</p>
      </div>
      <div class="bg-white shadow-sm rounded-xl p-4 hover:shadow-md transition">
        <h2 class="font-semibold text-lg">Item 3 — Bread</h2>
        <p class="text-gray-600 text-sm">Price: 1.30 KM</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-center py-4 border-t text-sm text-gray-500 mt-auto">
    <p>© 2025 Check App — Built with ❤️ by Dervis</p>
  </footer>

  <!-- (Later this will connect to backend) -->
  <script>
    const input = document.getElementById('searchInput');
    const list = document.getElementById('itemsList');

    input.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      // todo - fetch results from backend (via API)
      console.log("Searching for:", query);
    });
  </script>

</body>
</html>
