<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload - Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50 text-gray-900">

  <!-- Navbar -->
  <nav class="flex justify-between items-center px-6 py-4 bg-white shadow">
    <div class="text-2xl font-bold tracking-wide">
      <a href="/">CHECK</a>
    </div>
    <ul class="flex space-x-6 text-lg">

      <li><a href="/upload" class="text-blue-600 font-semibold">Upload</a></li>

  <!-- Upload Section -->
  <main class="flex-grow flex flex-col items-center justify-center px-6 text-center">

        <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="4"></circle>
        <path class="opacity-75" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      <span>Feature under development...</span>

    <p>© 2025 Check App — Built with ❤️ by Dervis</p>
